openapi: 3.0.0
info:
  title: Data API Gateway
  description: |
    API Gateway multi-tenant (Maxtop, Pandora, Toplink) dengan dukungan Dual-DB (Postgres & MSSQL) dan Keyset Pagination.

    ### Cara Menggunakan Filter pada Endpoint GET Inbox & Outbox:
    - **Tanggal (startDate & endDate)**: Menggunakan format `YYYY-MM-DD` (contoh: `2026-09-01`). Memfilter record berdasarkan `tgl_entri`.
    - **Text Search (reseller, pengirim, penerima, pesan)**: Pencarian string secara fleksibel. Filter `pesan` menggunakan pencarian kata kunci (`LIKE`/`ILIKE`).
    - **Select/Dropdown (terminal, tipe, status)**: Memfilter secara presisi berdasarkan kode terminal, tipe pengirim/penerima, atau status angka.
    - **Checkbox/Boolean (requestFromReseller, jawabanFromProvider, replyToReseller, perintahProvider)**: Nilai `true` atau `1` akan mengaktifkan kriteria khusus (seperti memfilter record non-null atau bendera status).
    - **Pagination (limit & cursor)**: Gunakan `limit` untuk menentukan jumlah data dan `cursor` (kode record terakhir) untuk memuat halaman berikutnya.
  version: 1.0.0
tags:
  - name: auth
    description: Authentication endpoints
  - name: user
    description: User management endpoints
  - name: inbox
    description: Inbox operations
  - name: outbox
    description: Outbox operations
servers:
  - url: /
    description: Current Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API Key Developer
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token yang didapatkan dari login

  parameters:
    TenantParam:
      name: tenant
      in: path
      required: true
      description: Nama Unit/Tenant (maxtop, pandora, toplink)
      schema:
        type: string
    DbSourceHeader:
      name: X-DB-Source
      in: header
      required: false
      description: Pilih mesin database (default menggunakan postgres)
      schema:
        type: string
        enum: [postgres, mssql]
        default: postgres

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "secret123"

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - rules
      properties:
        username:
          type: string
          example: "op_user1"
        password:
          type: string
          example: "secret123"
        rules:
          type: string
          example: "op"

    UpdateUserRequest:
      type: object
      properties:
        password:
          type: string
          example: "newsecret123"
        rules:
          type: string
          example: "opout"

    Inbox:
      type: object
      properties:
        kode:
          type: integer
          format: int64
          example: 105423
        tgl_entri:
          type: string
          format: date-time
          example: "2026-09-06T10:00:00Z"
        tgl_status:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-06T10:05:00Z"
        pengirim:
          type: string
          example: "08123456789"
        tipe_pengirim:
          type: string
          example: "SMS"
        penerima:
          type: string
          nullable: true
          example: "08987654321"
        pesan:
          type: string
          example: "SALDO"
        status:
          type: integer
          example: 0
        kode_terminal:
          type: integer
          nullable: true
          example: 1
        kode_reseller:
          type: string
          nullable: true
          example: "R001"
        kode_transaksi:
          type: integer
          nullable: true
          example: 54321
        is_jawaban:
          type: integer
          example: 0
        service_center:
          type: string
          nullable: true
          example: "SC01"
        is_cs:
          type: integer
          nullable: true
          example: 0
        kode_jawaban_cs:
          type: string
          nullable: true
          example: "1234"
        hash:
          type: string
          nullable: true
          example: "a1b2c3d4"

    InsertInboxRequest:
      type: object
      required:
        - pesan
        - pengirim
      properties:
        pesan:
          type: string
        pengirim:
          type: string
        penerima:
          type: string
        tipe_pengirim:
          type: string
        kode_terminal:
          type: integer
        kode_reseller:
          type: string
        kode_transaksi:
          type: integer
        service_center:
          type: string
        status:
          type: integer
        is_jawaban:
          type: integer
        is_cs:
          type: integer
        kode_jawaban_cs:
          type: string
        hash:
          type: string

    UpdateInboxRequest:
      type: object
      properties:
        pesan:
          type: string
        status:
          type: integer
        pengirim:
          type: string
        tipe_pengirim:
          type: string
        penerima:
          type: string
        kode_terminal:
          type: integer
        kode_reseller:
          type: string
        kode_transaksi:
          type: integer
        is_jawaban:
          type: integer
        service_center:
          type: string
        is_cs:
          type: integer
        kode_jawaban_cs:
          type: string
        hash:
          type: string

    Outbox:
      type: object
      properties:
        kode:
          type: integer
          format: int64
          example: 204300
        tgl_entri:
          type: string
          format: date-time
          example: "2026-09-06T10:00:00Z"
        penerima:
          type: string
          example: "08123456789"
        tipe_penerima:
          type: string
          example: "SMS"
        pesan:
          type: string
          example: "Saldo Anda: Rp100.000"
        status:
          type: integer
          example: 0
        tgl_status:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-06T10:05:00Z"
        kode_inbox:
          type: integer
          format: int64
          nullable: true
        kode_transaksi:
          type: integer
          nullable: true
        kode_reseller:
          type: string
          nullable: true
        bebas_biaya:
          type: integer
          example: 0
        is_perintah:
          type: integer
          nullable: true
        kode_modul:
          type: integer
          nullable: true
        prioritas:
          type: integer
          nullable: true
        modul_proses:
          type: string
          nullable: true
        pengirim:
          type: string
          nullable: true
        kode_terminal:
          type: integer
          nullable: true
        ctr_kirim:
          type: integer
          nullable: true

    InsertOutboxRequest:
      type: object
      required:
        - penerima
        - tipe_penerima
        - pesan
        - status
        - bebas_biaya
      properties:
        penerima:
          type: string
        tipe_penerima:
          type: string
        pesan:
          type: string
        status:
          type: integer
        bebas_biaya:
          type: integer
        kode_inbox:
          type: integer
          format: int64
        kode_transaksi:
          type: integer
        kode_reseller:
          type: string
        is_perintah:
          type: integer
        kode_modul:
          type: integer
        prioritas:
          type: integer
        modul_proses:
          type: string
        pengirim:
          type: string
        kode_terminal:
          type: integer
        ctr_kirim:
          type: integer

    UpdateOutboxRequest:
      type: object
      properties:
        penerima:
          type: string
        tipe_penerima:
          type: string
        pesan:
          type: string
        status:
          type: integer
        bebas_biaya:
          type: integer
        kode_inbox:
          type: integer
          format: int64
        kode_transaksi:
          type: integer
        kode_reseller:
          type: string
        is_perintah:
          type: integer
        kode_modul:
          type: integer
        prioritas:
          type: integer
        modul_proses:
          type: string
        pengirim:
          type: string
        kode_terminal:
          type: integer
        ctr_kirim:
          type: integer

paths:
  /api/v1/{tenant}/auth/login:
    post:
      summary: User Login
      description: Login dengan username dan password untuk mendapatkan token JWT.
      security:
        - ApiKeyAuth: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK

  /api/v1/{tenant}/auth/users:
    post:
      summary: Create User
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - user
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: OK

  /api/v1/{tenant}/auth/users/{username}:
    put:
      summary: Update User
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - user
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK

  /api/v1/{tenant}/inbox:
    get:
      summary: Get Inbox (dengan 10 Opsi Filter)
      description: |
        Mengambil daftar pesan Inbox dengan filter dinamis:
        1. **startDate** & **endDate**: Rentang tanggal (YYYY-MM-DD).
        2. **limit**: Jumlah maksimal record (default: 10).
        3. **terminal**: Kode terminal (integer).
        4. **reseller**: Kode reseller (string).
        5. **pengirim**: Nama atau nomor pengirim (string).
        6. **tipe**: Tipe pengirim (string).
        7. **status**: Status pesan (integer).
        8. **pesan**: Pencarian kata kunci pesan (LIKE).
        9. **requestFromReseller**: Filter boolean (`true` = memiliki kode_reseller).
        10. **jawabanFromProvider**: Filter boolean (`true` = is_jawaban = 1).
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - inbox
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
        - name: startDate
          in: query
          description: Tanggal mulai (Format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-01"
        - name: endDate
          in: query
          description: Tanggal akhir (Format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-30"
        - name: limit
          in: query
          description: Jumlah record yang diambil
          schema:
            type: integer
            default: 10
            example: 20
        - name: terminal
          in: query
          description: Filter kode terminal
          schema:
            type: integer
            example: 2
        - name: reseller
          in: query
          description: Filter kode reseller
          schema:
            type: string
            example: "R001"
        - name: pengirim
          in: query
          description: Filter pengirim
          schema:
            type: string
            example: "08123456789"
        - name: tipe
          in: query
          description: Filter tipe pengirim
          schema:
            type: string
            example: "S"
        - name: status
          in: query
          description: Filter status pesan
          schema:
            type: integer
            example: 1
        - name: pesan
          in: query
          description: Pencarian kata kunci pada kolom pesan (LIKE)
          schema:
            type: string
            example: "SALDO"
        - name: requestFromReseller
          in: query
          description: Checkbox filter request dari reseller (kode_reseller IS NOT NULL)
          schema:
            type: boolean
            example: true
        - name: jawabanFromProvider
          in: query
          description: Checkbox filter jawaban dari provider (is_jawaban = 1)
          schema:
            type: boolean
            example: true
        - name: search
          in: query
          description: Pencarian umum (pesan atau pengirim)
          schema:
            type: string
        - name: cursor
          in: query
          description: Cursor pagination (kode record terakhir)
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
    post:
      summary: Insert Inbox
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - inbox
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertInboxRequest"
      responses:
        "200":
          description: OK

  /api/v1/{tenant}/inbox/{kode}:
    put:
      summary: Update Inbox
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - inbox
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
        - name: kode
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInboxRequest"
      responses:
        "200":
          description: OK

  /api/v1/{tenant}/outbox:
    get:
      summary: Get Outbox (dengan 9 Opsi Filter)
      description: |
        Mengambil daftar pesan Outbox dengan filter dinamis:
        1. **startDate** & **endDate**: Rentang tanggal entri (YYYY-MM-DD).
        2. **limit**: Jumlah maksimal record (default: 10).
        3. **reseller**: Kode reseller (string).
        4. **penerima**: Nomor atau identifier penerima (string).
        5. **tipe**: Tipe penerima (string).
        6. **status**: Status outbox (integer).
        7. **pesan**: Pencarian kata kunci pesan (LIKE).
        8. **replyToReseller**: Filter boolean (`true` = memiliki kode_reseller).
        9. **perintahProvider**: Filter boolean (`true` = is_perintah = 1).
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - outbox
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
        - name: startDate
          in: query
          description: Tanggal entri mulai (Format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-01"
        - name: endDate
          in: query
          description: Tanggal entri akhir (Format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-30"
        - name: limit
          in: query
          description: Jumlah record yang diambil
          schema:
            type: integer
            default: 10
            example: 20
        - name: reseller
          in: query
          description: Filter kode reseller
          schema:
            type: string
            example: "R001"
        - name: penerima
          in: query
          description: Filter penerima
          schema:
            type: string
            example: "08123456789"
        - name: tipe
          in: query
          description: Filter tipe penerima
          schema:
            type: string
            example: "S"
        - name: status
          in: query
          description: Filter status pesan
          schema:
            type: integer
            example: 1
        - name: pesan
          in: query
          description: Pencarian kata kunci pada kolom pesan (LIKE)
          schema:
            type: string
            example: "Sukses"
        - name: replyToReseller
          in: query
          description: Checkbox filter reply ke reseller (kode_reseller IS NOT NULL)
          schema:
            type: boolean
            example: true
        - name: perintahProvider
          in: query
          description: Checkbox filter perintah provider (is_perintah = 1)
          schema:
            type: boolean
            example: true
        - name: search
          in: query
          description: Pencarian umum (pesan atau penerima)
          schema:
            type: string
        - name: cursor
          in: query
          description: Cursor pagination (kode record terakhir)
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
    post:
      summary: Insert Outbox
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - outbox
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertOutboxRequest"
      responses:
        "200":
          description: OK

  /api/v1/{tenant}/outbox/{kode}:
    put:
      summary: Update Outbox
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      tags:
        - outbox
      parameters:
        - $ref: "#/components/parameters/TenantParam"
        - $ref: "#/components/parameters/DbSourceHeader"
        - name: kode
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutboxRequest"
      responses:
        "200":
          description: OK
